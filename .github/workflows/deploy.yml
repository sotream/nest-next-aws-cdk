name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, stage, prod]
        required: true
      starter_ref:
        description: Full commit SHA of sotream/nest-next-starter to build and deploy
        type: string
        required: true
      allow_db_replacement:
        description: Let this deploy replace or delete the database
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The GitHub Environment holds AWS_DEPLOY_ROLE_ARN and, for stage and prod, the required reviewers.
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      STACK: nest-next-${{ inputs.environment }}
      STARTER_REF: ${{ inputs.starter_ref }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ALLOW_DB_REPLACEMENT: ${{ inputs.allow_db_replacement }}
    steps:
      - name: Validate the starter ref
        run: |
          if ! [[ "$STARTER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::starter_ref must be a full 40-character commit SHA, not a branch or tag name."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The domain variables carry the environment in their name; the app reads DOMAIN_NAME_<ENV> and friends.
      - name: Domain settings
        env:
          DOMAIN_NAME: ${{ vars[format('DOMAIN_NAME_{0}', inputs.environment)] }}
          HOSTED_ZONE_ID: ${{ vars[format('HOSTED_ZONE_ID_{0}', inputs.environment)] }}
          HOSTED_ZONE_NAME: ${{ vars[format('HOSTED_ZONE_NAME_{0}', inputs.environment)] }}
          ALARM_EMAIL: ${{ vars[format('ALARM_EMAIL_{0}', inputs.environment)] }}
        run: |
          suffix=$(tr '[:lower:]' '[:upper:]' <<<"$ENVIRONMENT")
          {
            echo "DOMAIN_NAME_$suffix=$DOMAIN_NAME"
            echo "HOSTED_ZONE_ID_$suffix=$HOSTED_ZONE_ID"
            echo "HOSTED_ZONE_NAME_$suffix=$HOSTED_ZONE_NAME"
            echo "ALARM_EMAIL_$suffix=$ALARM_EMAIL"
          } >> "$GITHUB_ENV"

      - name: Current image tag
        run: echo "CURRENT=$(scripts/current-image-tag.sh "$STACK" "$STACK-api")" >> "$GITHUB_ENV"

      - name: Diff
        run: |
          set -euo pipefail
          pnpm exec cdk diff "$STACK" --no-color -c "env=$ENVIRONMENT" -c "imageTag=$CURRENT" -c "migrateImageTag=$CURRENT" > diff.txt 2>&1 || true
          {
            echo '### cdk diff'
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/check-db-replacement.sh < diff.txt

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: sotream/nest-next-starter
          ref: ${{ inputs.starter_ref }}
          path: starter

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Infrastructure, images, migration, services: see scripts/rollout.sh.
      - name: Roll out
        id: rollout
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: scripts/rollout.sh "$STACK" "$ENVIRONMENT" starter

      - name: Smoke test
        run: scripts/smoke-test.sh "${{ steps.rollout.outputs.origin }}"
